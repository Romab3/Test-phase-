<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Inisfree Collective — Roma Bisnath</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Lato:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:#F5F0E8;
      --protea:#B87070;
      --charcoal:#1C1C1C;
    }

    body {
      background: var(--cream);
      color: var(--charcoal);
      font-family: 'Lato', sans-serif;
      line-height: 1.85;
    }

    /* NAV */
    nav {
      position: fixed; top:0; left:0; right:0;
      padding:1.5rem 4rem;
      display:flex; justify-content:space-between;
      z-index:100;
    }

    .nav-links { display:flex; gap:2rem; list-style:none; }

    /* HERO */
    #hero {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      position:relative;
      padding:10rem 2rem 6rem;
      overflow:hidden;
      background:#F5F0E8;
    }

    /* 🌸 NEW PROTEA */
    .hero-protea {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:clamp(240px,30vw,460px);
      opacity:0.08;
      pointer-events:none;
      z-index:0;
    }

    .hero-content {
      position:relative;
      z-index:1;
      max-width:640px;
    }

    h1 {
      font-family:'Cormorant Garamond', serif;
      font-size:clamp(1.5rem,2.6vw,2.2rem);
      font-weight:300;
      margin-bottom:1.5rem;
    }

    /* ABOUT */
    #about { padding:8rem 0; }

    .container {
      max-width:900px;
      margin:0 auto;
      padding:0 2rem;
    }

    /* ✨ UPDATED (NO DOTS) */
    .in-is-free {
      margin-top:2rem;
      display:flex;
      gap:1.4rem;
    }

    .in-is-free span {
      font-family:'Cormorant Garamond', serif;
      font-size:1.8rem;
      font-style:italic;
      color:#B87070;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .in-is-free span small {
      font-family:'Lato', sans-serif;
      font-size:.5rem;
      letter-spacing:.2em;
      text-transform:uppercase;
      color:#CC9090;
      margin-top:.3rem;
    }

  </style>
</head>

<body>

<!-- NAV -->
<nav>
  <div>The Inisfree Collective</div>
  <ul class="nav-links">
    <li><a href="#about">About</a></li>
  </ul>
</nav>

<!-- HERO -->
<section id="hero">

  <!-- 🌸 PROTEA ADDED -->
  <img src="images/protea.png" alt="Protea" class="hero-protea" />

  <div class="hero-content">
    <h1>"You don't have to believe everything you think."</h1>
    <p>— Adam Grant</p>
  </div>
</section>

<!-- ABOUT -->
<section id="about">
  <div class="container">

    <p>
      This is the quiet truth most people avoid. You don't need to do more.
      You need to choose more carefully.
    </p>

    <!-- ✨ DOTS REMOVED -->
    <div class="in-is-free">
      <span>In<small>within</small></span>
      <span>Is<small>exists</small></span>
      <span>Free<small>freedom</small></span>
    </div>

  </div>
</section>

</body>
</html>
